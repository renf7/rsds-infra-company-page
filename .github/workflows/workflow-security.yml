name: Workflow security
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-security-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zizmor:
    name: zizmor workflow security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install pinned zizmor
        run: |
          python -m pip install --only-binary=:all: zizmor==1.32.0
      - name: Audit every workflow without credentials or online access
        run: zizmor --offline --format plain .github/workflows

name: Publish main Docker image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-main-image
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: renf7/rsds-infra-company-page
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Enable attestation-preserving containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6
        with:
          daemon-config: |
            {"features":{"containerd-snapshotter":true}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build main without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          provenance: mode=min
          sbom: true
          push: false
          tags: |
            ${{ env.IMAGE }}:git-${{ github.sha }}
            ${{ env.IMAGE }}:latest
      - name: Scan the exact image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.IMAGE }}:git-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Install keyless image signing tool
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532
        with:
          cosign-release: v3.1.4
      - name: Publish scanned main image
        run: |
          docker push "$IMAGE:git-$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Retain registry attestation evidence
        run: |
          mkdir -p image-evidence
          docker buildx imagetools inspect "$IMAGE:git-$GITHUB_SHA" --raw > image-evidence/index.json
          docker buildx imagetools inspect "$IMAGE:git-$GITHUB_SHA" --format '{{ json .Provenance.SLSA }}' > image-evidence/provenance.json
          docker buildx imagetools inspect "$IMAGE:git-$GITHUB_SHA" --format '{{ json .SBOM.SPDX }}' > image-evidence/sbom.json
          jq -e '.manifests | any(.annotations["vnd.docker.reference.type"] == "attestation-manifest")' image-evidence/index.json
          jq -e '. != null' image-evidence/provenance.json
          jq -e '. != null' image-evidence/sbom.json
      - name: Sign and verify the immutable published image
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:git-$GITHUB_SHA" --format '{{json .Manifest.Digest}}' | jq -r .)
          test "${digest#sha256:}" != "$digest"
          reference="$IMAGE@$digest"
          cosign sign --yes "$reference"
          # Registry referrers can lag a successful upload. Retry verification only;
          # preserve identity, issuer, digest and transparency validation on every attempt.
          verified=false
          for attempt in 1 2 3 4 5 6; do
            if cosign verify "$reference" --certificate-identity 'https://github.com/renf7/rsds-infra-company-page/.github/workflows/docker-build.yml@refs/heads/main' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' > image-evidence/signature-verification.json; then
              verified=true
              break
            fi
            if [ "$attempt" -lt 6 ]; then sleep 10; fi
          done
          test "$verified" = true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: main-image-attestations
          retention-days: 7
          path: image-evidence/

name: Build and push Docker image

# Only a remote push that changes main builds and publishes an image.
on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      # Fall back to a local image name when Docker Hub secrets are not configured.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/rsds-infra-company-page', secrets.DOCKERHUB_USERNAME) || 'rsds-infra-company-page' }}
      PUSH: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          load: true
          push: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:git-${{ github.sha }}
      - name: Scan image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ env.IMAGE }}:git-${{ github.sha }}
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
      - name: Publish scanned image
        if: env.PUSH == 'true'
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:git-$GITHUB_SHA"
